{{- if .Values.tls.enabled }}
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: partner-vcp
spec:
  hosts:
  {{- range .Values.partner.hosts }}
    - {{ . | quote }}
  {{- end }}
  {{- if and (.Values.partner.etcdMaster)
             (.Values.partner.etcdMaster.host)
             (not (has .Values.partner.etcdMaster.host .Values.partner.hosts)) }}
    - {{ .Values.partner.etcdMaster.host | quote }}
  {{- end }}
  # Istio >= 1.2x only allows CIDR "addresses" with NONE/STATIC resolution; this entry uses DNS
  # resolution of the partner FQDNs, so the former etcdMaster.ip /32 address is not set.
  ports:
    - number: 80
      name: http
      protocol: HTTP
      targetPort: 1443
    - number: 2379
      name: etcd-tcp
      protocol: TCP
      targetPort: 2379
  resolution: DNS
  location: MESH_EXTERNAL
{{- end }}
